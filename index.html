<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASCEND | Training OS</title><meta name="theme-color" content="#0c1019"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ASCEND"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{color-scheme:dark;--bg:#0c1019;--panel:#171e2b;--panel2:#202a3a;--line:#344054;--text:#f3f6fc;--muted:#aab6ca;--accent:#73e2b2;--blue:#7ab8ff;--danger:#ff8b8b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{padding:24px max(20px,calc((100vw - 1200px)/2));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:25px;margin:0}h2{font-size:21px;margin:0 0 14px}h3{margin:0 0 10px;font-size:16px}p{color:var(--muted);line-height:1.5}small,.muted{color:var(--muted)}.tag{background:#193a35;color:var(--accent);border-radius:20px;padding:6px 11px;font-size:12px;font-weight:700}.wrap{max-width:1200px;margin:auto;padding:20px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.nav button{background:var(--panel);color:var(--muted)}button{cursor:pointer;background:var(--accent);border:0;border-radius:9px;padding:10px 14px;font:inherit;font-weight:700;color:#092119}button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}button.danger{background:#44272d;color:#ffb2b2}.nav button.active{background:var(--accent);color:#092119}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}.stat{font-size:27px;font-weight:800;margin-top:8px}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}input,select,textarea{width:100%;background:#101722;color:var(--text);border:1px solid #45536a;border-radius:8px;padding:10px;font:inherit}textarea{min-height:72px}.field{margin-bottom:13px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spread{justify-content:space-between}.exercise{padding:14px 0;border-top:1px solid var(--line)}.exercise:first-child{border:0}.exercise strong{font-size:15px}.pill{display:inline-block;background:#283448;color:#d2e1f4;padding:4px 8px;border-radius:6px;font-size:12px;margin:4px 4px 4px 0}.sets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.sets .field{margin:0}.note{background:#24313c;border-left:3px solid var(--blue);padding:12px;border-radius:5px;color:#dce8f7;margin:12px 0}.success{color:var(--accent)}.warn{color:#ffd58c}.hidden{display:none!important}table{border-collapse:collapse;width:100%}td,th{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted)}.scroll{overflow:auto}canvas{width:100%;height:200px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.footer{font-size:12px;color:var(--muted);padding:25px 0}input[type=checkbox]{width:auto;accent-color:var(--accent)}@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.sets{grid-template-columns:repeat(2,1fr)}header{padding:18px}.wrap{padding:12px}}@media(max-width:380px){.grid{grid-template-columns:1fr}}

/* ASCEND v4 mobile refinements */
@media(max-width:750px){header{padding:16px 14px}h1{font-size:23px}.wrap{padding:10px 12px 30px}.nav{position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}.nav::-webkit-scrollbar{display:none}.nav button{white-space:nowrap;flex-shrink:0;padding:10px 13px}.card{padding:14px}.stat{font-size:23px}input,select,textarea{font-size:16px}button{min-height:42px}.sets{gap:7px}.sets input{min-height:42px}}
</style></head><body>
<header><div><h1>ASCEND <span style="color:var(--accent)">/ COACH</span></h1><small>Strength • Hypertrophy • Cut</small></div><span class="tag">PERSONAL · V4.0</span></header>
<main class="wrap"><nav class="nav" id="nav"></nav><div id="view"></div><div class="footer">Data is stored in this browser on this device. Export backups regularly. This tool is a training log, not medical supervision.</div></main>
<script>
"use strict";
const DAYS=[
{title:"Push A · Bench Strength",ex:[["Barbell bench press",3,"4–6","3","175–190 lb"],["Neutral-grip DB incline press",2,"8–10","2–3",""],["Cable chest fly",2,"10–15","2",""],["Cable lateral raise",3,"12–20","2",""],["Rope triceps pushdown",3,"10–15","1–2",""],["Cable external rotation",2,"12–15","Easy",""]]},
{title:"Pull A · Back Strength",ex:[["Weighted pull-up or pulldown",3,"5–8","2",""],["Chest-supported row",3,"6–10","2",""],["Neutral-grip cable row",2,"10–12","2",""],["Reverse pec deck",3,"12–20","2",""],["EZ-bar curl",3,"8–12","1–2",""],["Hammer curl",2,"10–15","1–2",""]]},
{title:"Legs A · Squat Strength",ex:[["Barbell back squat",3,"4–6","2–3","285–305 lb"],["Leg press",3,"8–12","2",""],["Seated leg curl",3,"10–15","2",""],["Leg extension",2,"12–15","1–2",""],["Standing calf raise",4,"8–12","1–2",""],["Cable crunch",3,"10–15","2",""]]},
{title:"Push B · Hypertrophy",ex:[["Neutral-grip DB chest press",3,"8–12","2–3",""],["Converging chest press machine",2,"10–12","2",""],["Cable chest fly",2,"12–15","2",""],["Cable lateral raise",3,"12–20","2",""],["Single-arm cable triceps extension",3,"10–15","1–2",""],["Serratus wall slide",2,"10–12","Easy",""]]},
{title:"Pull B · Hypertrophy",ex:[["Neutral-grip lat pulldown",3,"8–12","2",""],["Machine high row",3,"8–12","2",""],["Single-arm cable row",2,"10–15","2",""],["Reverse pec deck",2,"15–20","2",""],["Incline DB curl",3,"10–12","1–2",""],["Preacher curl",2,"10–15","1–2",""]]},
{title:"Legs B · Deadlift Strength",ex:[["Conventional deadlift",2,"3–5","3","305–325 lb"],["Hack squat",3,"8–12","2",""],["Seated leg curl",3,"10–15","2",""],["Bulgarian split squat",2,"8–12/leg","2",""],["Seated calf raise",4,"10–15","1–2",""],["Hanging knee raise",3,"10–15","2",""]]}];
const KEY="iron_atlas_v1", TODAY=()=>new Date().toLocaleDateString("en-CA");
const defaults=()=>({profile:{weight:235,bench:250,squat:405,deadlift:435,calories:2800,protein:205,creatine:5,start:TODAY()},sessions:[],nutrition:[],weights:[],notes:[],substitutions:{},coachMessages:[]});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||defaults()}catch(e){data=defaults()}
data.substitutions??={};data.coachMessages??=[];
let tab="Dashboard",day=0,workoutDate=TODAY(),draft={},nutritionDate=TODAY();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const num=(v,f=0)=>Number.isFinite(+v)&&String(v).trim()!==""?+v:f;
const recent=(a,n=5)=>a.slice().sort((x,y)=>y.date.localeCompare(x.date)).slice(0,n);
const el=id=>document.getElementById(id);
function nav(){el("nav").innerHTML=["Dashboard","Workouts","Insights","PRs","Coach","Nutrition","Progress","Settings"].map(t=>`<button class="${tab===t?"active":""}" data-tab="${t}">${t}</button>`).join("");document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function stat(label,value,sub=""){return `<div class="card"><div class="label">${label}</div><div class="stat">${esc(value)}</div><small>${esc(sub)}</small></div>`}
function dashboard(){
let latest=recent(data.weights,1)[0],n=data.nutrition.find(x=>x.date===TODAY()),sessions=data.sessions.filter(s=>s.date>=new Date(Date.now()-7*864e5).toLocaleDateString("en-CA"));
let todayDay=(new Date().getDay()+6)%7;
return `<h2>Your personal training dashboard</h2><div class="grid">${stat("Body weight",latest?latest.weight+" lb":data.profile.weight+" lb","Latest logged")}${stat("Sessions / 7 days",sessions.length+" / 6","Training frequency")}${stat("Today's protein",(n?.protein||0)+" / "+data.profile.protein+" g","Daily target")}${stat("Creatine",data.profile.creatine+" g","Every day")}</div>
<div class="two"><div class="card"><h3>Today's suggested session</h3><p>${todayDay===6?"Sunday · Recovery":esc(DAYS[todayDay].title)}</p><button id="gotoWorkout">${todayDay===6?"View training plan":"Open workout"}</button><p class="muted">Bench 250 • Squat 405 • Deadlift 435 lb baseline</p></div>
<div class="card"><h3>Coach's priorities</h3><p>1. Maintain lifting performance during your cut.<br>2. Log sets, reps, RIR, and shoulder response.<br>3. Eat enough to recover; track intake before assuming a calorie deficit.<br>4. Aim for gradual weight loss and take 5 g creatine daily.</p></div></div>
<div class="card"><h3>Recent training</h3>${data.sessions.length?`<div class="scroll"><table><tr><th>Date</th><th>Session</th><th>Sets</th><th>Shoulder</th></tr>${recent(data.sessions).map(s=>`<tr><td>${esc(s.date)}</td><td>${esc(DAYS[s.day].title)}</td><td>${s.sets.length}</td><td>${esc(s.shoulder)}/10</td></tr>`).join("")}</table></div>`:"<p>No sessions yet. Start by logging your first workout.</p>"}</div>`;
}
function draftKey(){return workoutDate+"|"+day}
function workouts(){
const d=DAYS[day],prev=recent(data.sessions.filter(s=>s.day===day),1)[0],k=draftKey();draft[k]??={};
return `<div class="row spread"><h2>Workout logger</h2><select id="daySelect" style="max-width:300px">${DAYS.map((x,i)=>`<option value="${i}" ${i===day?"selected":""}>${esc(x.title)}</option>`).join("")}</select></div>
<div class="card"><div class="row spread" style="margin-bottom:12px"><div><div class="label">REST TIMER</div><div id="restClock" class="stat" style="font-variant-numeric:tabular-nums">00:00</div></div><div class="buttons"><button type="button" class="secondary" data-rest="90">1:30</button><button type="button" class="secondary" data-rest="120">2:00</button><button type="button" class="secondary" data-rest="180">3:00</button><button type="button" class="danger" id="stopRest">Stop</button></div></div><div class="two"><div class="field"><label>Workout date</label><input id="workoutDate" type="date" value="${workoutDate}"></div><div class="field"><label>Shoulder pain (0–10)</label><input id="shoulder" type="number" min="0" max="10" value="${esc(draft[k].shoulder??0)}"></div></div><div class="note">Working sets only. Rest 2–4 min on compounds, 60–120 sec on accessories. Avoid forcing painful reps. Recurrent pressing pain deserves a sports PT assessment.</div>
${d.ex.map((x,i)=>`<div class="exercise"><div class="row spread"><strong>${i+1}. ${esc(x[0])}</strong><span class="pill">${x[1]} × ${esc(x[2])} · ${esc(x[3])} RIR</span></div>${x[4]?`<small>Initial reference: ${esc(x[4])}, adjust to actual RIR</small>`:""}
<div class="row" style="margin:8px 0"><label style="margin:0">Exercise option</label><select data-sub="${i}" style="max-width:330px">${exerciseOptions(x[0]).map(v=>`<option ${selectedExercise(day,i)===v?"selected":""}>${esc(v)}</option>`).join("")}</select></div>
<div class="note" style="margin:8px 0">${esc(recommend(day,i))}</div>${prev?`<div><small>Previous: ${prev.sets.filter(s=>s.slot===i||s.exercise===x[0]).map(s=>`${s.weight}×${s.reps}`).join(" · ")||"not logged"}</small></div>`:""}
${Array.from({length:x[1]},(_,j)=>{const v=draft[k][`${i}-${j}`]||{};return `<div class="sets"><div class="field"><label>Set ${j+1} · lb</label><input type="number" min="0" step="0.5" data-set="${i}-${j}" data-prop="weight" value="${esc(v.weight??"")}" placeholder="Weight"></div><div class="field"><label>Reps</label><input type="number" min="0" data-set="${i}-${j}" data-prop="reps" value="${esc(v.reps??"")}" placeholder="Reps"></div><div class="field"><label>RIR</label><input type="number" min="0" max="10" data-set="${i}-${j}" data-prop="rir" value="${esc(v.rir??"")}" placeholder="RIR"></div><div class="field"><label>Completed</label><input type="checkbox" data-set="${i}-${j}" data-prop="done" ${v.done?"checked":""}></div></div>`}).join("")}</div>`).join("")}
<div class="field"><label>Session notes / pain after training</label><textarea id="sessionNotes" placeholder="Energy, form, shoulder response, etc.">${esc(draft[k].notes??"")}</textarea></div><div class="buttons"><button id="saveWorkout">Save completed workout</button><button class="secondary" id="clearDraft">Clear draft</button></div></div>`;
}
function nutrition(){
let n=data.nutrition.find(x=>x.date===nutritionDate)||{};
return `<h2>Nutrition & recovery</h2><div class="grid">${stat("Calories target",data.profile.calories,"Provisional")}${stat("Protein target",data.profile.protein+" g","Daily")}${stat("Creatine",data.profile.creatine+" g","Daily")}${stat("Weight-loss pace","0.5–1 lb","Per week")}</div>
<div class="card"><div class="field"><label>Log date</label><input type="date" id="nutritionDate" value="${nutritionDate}"></div><div class="two">
${[["calories","Calories eaten"],["protein","Protein (g)"],["carbs","Carbs (g)"],["fat","Fat (g)"],["water","Water (oz)"],["sleep","Sleep (hours)"]].map(([key,label])=>`<div class="field"><label>${label}</label><input id="n_${key}" type="number" min="0" step="any" value="${esc(n[key]??"")}"></div>`).join("")}</div>
<div class="field"><label><input id="n_creatine" type="checkbox" ${n.creatine?"checked":""}> Took 5 g creatine today</label></div>
<div class="field"><label>Meals / recovery notes</label><textarea id="n_notes">${esc(n.notes??"")}</textarea></div><button id="saveNutrition">Save daily nutrition</button></div>
<div class="card"><h3>Recent nutrition logs</h3><div class="scroll"><table><tr><th>Date</th><th>Calories</th><th>Protein</th><th>Creatine</th></tr>${recent(data.nutrition,10).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.calories||"—")}</td><td>${esc(x.protein||"—")} g</td><td>${x.creatine?"✓":"—"}</td></tr>`).join("")}</table></div></div>`;
}
function progress(){
const w=recent(data.weights,30),p=data.profile;
return `<h2>Progress & measurements</h2><div class="grid">${stat("Bench max",p.bench+" lb")}${stat("Squat max",p.squat+" lb")}${stat("Deadlift max",p.deadlift+" lb")}${stat("Total",(num(p.bench)+num(p.squat)+num(p.deadlift))+" lb")}</div>
<div class="two"><div class="card"><h3>Body-weight log</h3><div class="two"><div class="field"><label>Date</label><input id="weightDate" type="date" value="${TODAY()}"></div><div class="field"><label>Weight (lb)</label><input id="weightValue" type="number" min="1" step=".1" placeholder="235.0"></div></div><button id="saveWeight">Log weigh-in</button><p>Creatine can increase water weight. Compare multiweek averages, not single weigh-ins.</p></div>
<div class="card"><h3>Weight trend</h3><canvas id="weightChart" width="550" height="220"></canvas></div></div>
<div class="card"><h3>Recent weigh-ins</h3><div class="scroll"><table><tr><th>Date</th><th>Weight</th><th></th></tr>${w.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.weight)} lb</td><td><button class="secondary" data-delete-weight="${esc(x.date)}">Delete</button></td></tr>`).join("")}</table></div></div>
<div class="card"><h3>Logged workout history</h3><div class="scroll"><table><tr><th>Date</th><th>Workout</th><th>Sets</th><th>Total volume</th><th></th></tr>${recent(data.sessions,20).map(s=>`<tr><td>${esc(s.date)}</td><td>${esc(DAYS[s.day].title)}</td><td>${s.sets.length}</td><td>${Math.round(s.sets.reduce((a,x)=>a+num(x.weight)*num(x.reps),0)).toLocaleString()} lb</td><td><button class="secondary" data-delete-session="${esc(s.id)}">Delete</button></td></tr>`).join("")}</table></div></div>`;
}
function settings(){let p=data.profile;return `<h2>Profile & data</h2><div class="card"><h3>Your coaching targets</h3><div class="two">${[["weight","Starting weight (lb)"],["bench","Bench 1RM (lb)"],["squat","Squat 1RM (lb)"],["deadlift","Deadlift 1RM (lb)"],["calories","Daily calorie estimate"],["protein","Daily protein target (g)"],["creatine","Daily creatine (g)"]].map(([k,l])=>`<div class="field"><label>${l}</label><input id="p_${k}" type="number" min="0" value="${esc(p[k])}"></div>`).join("")}</div><button id="saveSettings">Save targets</button></div>
<div class="card"><h3>Backup and restore</h3><p>Your logs remain in this browser only. Export a backup regularly, especially before clearing browser data or switching devices.</p><div class="buttons"><button id="export">Export JSON backup</button><button id="exportCSV" class="secondary">Export workout CSV</button><label class="secondary" style="padding:10px;border:1px solid var(--line);border-radius:9px;cursor:pointer">Import JSON backup <input type="file" id="import" accept=".json,application/json" style="display:none"></label></div></div>
<div class="card"><h3>Progression rules</h3><p>Build reps within the prescribed range. Once all sets reach the top at the target RIR with consistent technique, add roughly 2.5–5 lb on upper-body compounds or 5–10 lb on lower-body compounds. If fatigue rises or performance falls, assess sleep, food intake, and total workload before adding volume.</p><p class="warn">Recurring shoulder pain during and after pressing should be evaluated by a sports physical therapist. Do not use the app to push through worsening pain.</p></div>`}

const ALTERNATIVES={
"Barbell bench press":["Barbell bench press","Paused barbell bench press","Neutral-grip dumbbell floor press","Machine chest press"],
"Neutral-grip DB incline press":["Neutral-grip DB incline press","Low-incline machine press","Flat dumbbell press"],
"Cable chest fly":["Cable chest fly","Pec deck","Low-to-high cable fly"],
"Cable lateral raise":["Cable lateral raise","Dumbbell lateral raise","Machine lateral raise"],
"Rope triceps pushdown":["Rope triceps pushdown","Straight-bar pushdown"],
"Cable external rotation":["Cable external rotation","Band external rotation"],
"Weighted pull-up or pulldown":["Weighted pull-up or pulldown","Neutral-grip lat pulldown","Assisted pull-up"],
"Chest-supported row":["Chest-supported row","Seal row","Chest-supported machine row"],
"Neutral-grip cable row":["Neutral-grip cable row","Single-arm cable row"],
"Reverse pec deck":["Reverse pec deck","Cable rear-delt fly"],
"EZ-bar curl":["EZ-bar curl","Cable curl"],
"Hammer curl":["Hammer curl","Rope hammer curl"],
"Barbell back squat":["Barbell back squat","Safety-bar squat","Hack squat"],
"Leg press":["Leg press","Belt squat"],
"Seated leg curl":["Seated leg curl","Lying leg curl"],
"Leg extension":["Leg extension","Single-leg extension"],
"Standing calf raise":["Standing calf raise","Leg press calf raise"],
"Cable crunch":["Cable crunch","Machine crunch"],
"Neutral-grip DB chest press":["Neutral-grip DB chest press","Neutral-grip machine chest press","Dumbbell floor press"],
"Converging chest press machine":["Converging chest press machine","Plate-loaded chest press"],
"Single-arm cable triceps extension":["Single-arm cable triceps extension","Rope pushdown"],
"Serratus wall slide":["Serratus wall slide","Scapular wall slide"],
"Neutral-grip lat pulldown":["Neutral-grip lat pulldown","Assisted neutral-grip pull-up"],
"Machine high row":["Machine high row","Chest-supported high row"],
"Single-arm cable row":["Single-arm cable row","One-arm dumbbell row"],
"Incline DB curl":["Incline DB curl","Standing cable curl"],
"Preacher curl":["Preacher curl","Machine preacher curl"],
"Conventional deadlift":["Conventional deadlift","Trap-bar deadlift","Romanian deadlift"],
"Hack squat":["Hack squat","Leg press"],
"Bulgarian split squat":["Bulgarian split squat","Reverse lunge"],
"Seated calf raise":["Seated calf raise","Donkey calf raise"],
"Hanging knee raise":["Hanging knee raise","Reverse crunch"]};
function exerciseOptions(name){return ALTERNATIVES[name]||[name]}
function selectedExercise(d,i){return data.substitutions[d+"-"+i]||DAYS[d].ex[i][0]}
function slotSets(s,d,i){return s.sets.filter(x=>x.slot===i||(!("slot" in x)&&x.exercise===DAYS[d].ex[i][0]))}
function recommend(d,i){
 const x=DAYS[d].ex[i],history=data.sessions.filter(s=>s.day===d&&slotSets(s,d,i).length).sort((a,b)=>b.date.localeCompare(a.date));
 if(!history.length)return "First session: choose a load that matches "+x[3]+" RIR. Record every working set.";
 const last=history[0],ss=slotSets(last,d,i),repRange=x[2].match(/^(\d+)[–-](\d+)/);
 if(!repRange)return "Repeat a comfortable load and focus on controlled movement.";
 const hi=+repRange[2],lo=+repRange[1],weight=ss[0]?.weight||0,rirTarget=parseFloat(x[3]),same=ss.every(t=>t.weight===weight),allTop=ss.length>=x[1]&&ss.every(t=>t.reps>=hi&&t.rir!==null&&t.rir>=rirTarget);
 if(last.shoulder>=4&&(d===0||d===3))return "Shoulder symptoms were elevated last session. Do not increase pressing load; consider a comfortable substitute and professional assessment.";
 if(allTop&&same&&weight>0){let inc=(d===2||d===5)?5:2.5;return "Progression ready: try "+(weight+inc)+" lb (+ "+inc+" lb), keeping "+x[3]+" RIR. For dumbbells, use the smallest available jump."}
 if(ss.some(t=>t.rir!==null&&t.rir<rirTarget-1))return "Hold or slightly reduce load: last session was harder than the prescribed RIR.";
 if(ss.some(t=>t.reps<lo))return "Repeat or lower the load until all working sets meet the minimum reps at target RIR.";
 return "Keep approximately "+weight+" lb and aim to add 1 rep across your working sets before raising the weight.";
}
function getPRs(){
 const map={};data.sessions.forEach(s=>s.sets.forEach(x=>{if(!x.weight||!x.reps)return;const k=x.exercise;map[k]??={exercise:k,bestWeight:0,bestVolume:0,bestEstimated:0,bestReps:0,date:""};let p=map[k],estimated=x.weight*(1+x.reps/30);if(x.weight>p.bestWeight)p.bestWeight=x.weight;if(x.weight*x.reps>p.bestVolume)p.bestVolume=x.weight*x.reps;if(estimated>p.bestEstimated){p.bestEstimated=estimated;p.bestReps=x.reps;p.date=s.date}}));return Object.values(map).sort((a,b)=>a.exercise.localeCompare(b.exercise))}
function prs(){let arr=getPRs();return `<h2>Personal records</h2><p>Automatically calculated from your saved working sets. Estimated 1RM uses the Epley formula and is less reliable at high repetitions; it is not a tested maximum.</p>
<div class="grid">${stat("Logged exercises",arr.length)}${stat("Bench baseline",data.profile.bench+" lb")}${stat("Squat baseline",data.profile.squat+" lb")}${stat("Deadlift baseline",data.profile.deadlift+" lb")}</div>
<div class="card"><h3>Exercise PR board</h3><div class="scroll"><table><tr><th>Exercise</th><th>Heaviest set</th><th>Best estimated 1RM</th><th>Best set volume</th><th>Date</th></tr>${arr.map(p=>`<tr><td>${esc(p.exercise)}</td><td>${p.bestWeight} lb</td><td>${p.bestEstimated.toFixed(1)} lb</td><td>${Math.round(p.bestVolume)} lb</td><td>${esc(p.date)}</td></tr>`).join("")}</table></div>${!arr.length?"<p>Save a workout to populate your PR board.</p>":""}</div>`}
function coachSummary(){
 let sessions=recent(data.sessions,12),weights=recent(data.weights,14),nutrition=recent(data.nutrition,7);
 return `ASCEND training coaching review\nGoal: strength + hypertrophy while cutting. Age 19, bodyweight 235 lb. Bench 250, squat 405, deadlift 435 lb tested baseline. Six-day PPL, 5g creatine daily. Shoulder pain during and after pressing; user prefers original split. \nRecent workouts:\n${sessions.map(s=>`${s.date} ${DAYS[s.day].title}, pain ${s.shoulder}/10, ${s.sets.map(x=>`${x.exercise} ${x.weight}x${x.reps} RIR ${x.rir}`).join("; ")}`).join("\n")}\nRecent bodyweights: ${weights.map(x=>x.date+" "+x.weight).join(", ")}\nRecent nutrition: ${nutrition.map(x=>`${x.date} ${x.calories} kcal, ${x.protein}g protein`).join("; ")}\nPlease analyze trends, recommend next-week loads and recovery/nutrition adjustments, and account for shoulder symptoms.`;
}
function coachReply(q){
 const t=q.toLowerCase(),w=recent(data.weights,14),n=recent(data.nutrition,7),ss=recent(data.sessions,8);
 if(/shoulder|pain|injur/.test(t))return "You've reported pain during and after pressing. Keep the overall split if desired, but don't force painful reps or increase loads through symptoms. Record pain during and the next morning. Because it recurs, a sports physical therapist evaluation is recommended. I cannot diagnose the cause.";
 if(/calor|protein|diet|food|cut|weight loss/.test(t)){let avg=n.length?Math.round(n.reduce((a,x)=>a+x.calories,0)/n.length):null;return `Your provisional targets are ${data.profile.calories} kcal and ${data.profile.protein}g protein daily. ${avg!==null?`Your logged average is ${avg} kcal over ${n.length} days.`:"Log meals for a week to establish actual intake."} Aim for about 0.5–1 lb/week weight loss; account for water changes after restarting creatine. Avoid aggressive restriction.`}
 if(/progress|next|increase|load|bench|squat|deadlift/.test(t)){let d=/squat/.test(t)?2:/deadlift/.test(t)?5:0;return `${DAYS[d].title}: ${recommend(d,0)} Progress by reps first, then small weight increases. These are rule-based suggestions, not an assessment of your form.`}
 if(/recover|fatigue|sleep|rest/.test(t))return "Keep 1–3 reps in reserve on most sets, sleep 7–9 hours, and eat enough to support six sessions. If multiple lifts regress and fatigue accumulates, consider a lighter week or fewer sets.";
 if(/pr|record/.test(t)){let prs=getPRs().sort((a,b)=>b.bestEstimated-a.bestEstimated).slice(0,3);return prs.length?"Top logged estimated 1RMs: "+prs.map(x=>`${x.exercise} ${x.bestEstimated.toFixed(0)} lb`).join("; "):"Log your completed working sets to calculate exercise PRs."}
 return `You have ${ss.length} recent logged sessions, ${w.length} weigh-ins and ${n.length} nutrition entries. I can explain progression, PRs, nutrition, or recovery based on those records. For deeper individualized analysis, use “Copy coaching summary” and paste it into ChatGPT.`;
}
function coach(){return `<h2>ASCEND Coach</h2><div class="note">Built-in coaching is offline and rule-based; it does not contact an AI service. Use the summary export for deeper analysis with ChatGPT.</div>
<div class="card"><h3>Ask your coach</h3><div class="buttons" style="margin-bottom:14px"><button class="secondary" data-prompt="What should I increase next week?">Next-week loads</button><button class="secondary" data-prompt="How is my nutrition for my cut?">Cut review</button><button class="secondary" data-prompt="What are my PRs?">PR review</button><button class="secondary" data-prompt="How should I handle shoulder pain?">Shoulder guidance</button></div>
<div style="max-height:360px;overflow:auto;margin-bottom:14px">${data.coachMessages.length?data.coachMessages.slice(-14).map(m=>`<div class="card" style="background:${m.role==="user"?"#253449":"#1a302e"}"><small>${m.role==="user"?"You":"ASCEND Coach"}</small><p style="color:var(--text);white-space:pre-wrap;margin-bottom:0">${esc(m.text)}</p></div>`).join(""):"<p>Ask about progression, cutting nutrition, recovery, PRs, or shoulder-conscious training.</p>"}</div>
<div class="field"><label>Your question</label><textarea id="coachQuestion" placeholder="How should I progress my bench next week?"></textarea></div><div class="buttons"><button id="askCoach">Ask ASCEND</button><button class="secondary" id="copyCoach">Copy coaching summary for ChatGPT</button></div></div>`}
function askCoach(){let q=el("coachQuestion").value.trim();if(!q)return;data.coachMessages.push({role:"user",text:q},{role:"coach",text:coachReply(q)});save();render()}


// ASCEND v4: offline coaching analytics and resilient local rest timer.
let restTimerId=null;
function startRest(seconds){localStorage.setItem('ascend_rest_deadline',String(Date.now()+seconds*1000));updateRestClock()}
function stopRest(){localStorage.removeItem('ascend_rest_deadline');updateRestClock()}
function updateRestClock(){const node=el('restClock');if(!node)return;const deadline=Number(localStorage.getItem('ascend_rest_deadline')||0);let remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));node.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');node.style.color=remaining>0?'var(--accent)':'var(--muted)';if(deadline&&remaining===0){localStorage.removeItem('ascend_rest_deadline');node.textContent='DONE';}}
if(!restTimerId)restTimerId=setInterval(updateRestClock,1000);
function dateToLocal(d){let t=new Date(d+'T12:00:00');return Number.isNaN(t.getTime())?null:t}
function daysAgo(d){const x=dateToLocal(d);return x?Math.floor((Date.now()-x.getTime())/86400000):9999}
function sevenDayAverage(entries,field,anchorDate){const end=dateToLocal(anchorDate);if(!end)return null;const start=end.getTime()-6*86400000;const vals=entries.filter(x=>{let t=dateToLocal(x.date)?.getTime();return t>=start&&t<=end.getTime()}).map(x=>Number(x[field])).filter(Number.isFinite);return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null}
function weeklySummary(){const now=TODAY(),start=new Date(Date.now()-6*86400000).toLocaleDateString('en-CA'),s=data.sessions.filter(x=>x.date>=start&&x.date<=now),n=data.nutrition.filter(x=>x.date>=start&&x.date<=now),w=data.weights.filter(x=>x.date>=start&&x.date<=now),volume=s.reduce((a,x)=>a+x.sets.reduce((b,t)=>b+num(t.weight)*num(t.reps),0),0),protein=n.length?n.reduce((a,x)=>a+num(x.protein),0)/n.length:null,calories=n.length?n.reduce((a,x)=>a+num(x.calories),0)/n.length:null,shoulder=s.length?s.reduce((a,x)=>a+num(x.shoulder),0)/s.length:null;return {s,n,w,volume,protein,calories,shoulder,start,now}}
function exerciseTrend(){let names=[...new Set(data.sessions.flatMap(s=>s.sets.map(x=>x.exercise)))].sort();return names}
function exercisePoints(name){return data.sessions.slice().sort((a,b)=>a.date.localeCompare(b.date)).flatMap(s=>{let sets=s.sets.filter(x=>x.exercise===name&&x.weight>0&&x.reps>0);if(!sets.length)return [];let best=Math.max(...sets.map(x=>x.weight*(1+x.reps/30)));return [{date:s.date,value:best}]}).slice(-20)}
function drawExerciseTrend(name){const c=el('exerciseChart');if(!c)return;const ctx=c.getContext('2d'),pts=exercisePoints(name);ctx.clearRect(0,0,c.width,c.height);ctx.font='14px system-ui';ctx.fillStyle='#aab6ca';if(pts.length<2){ctx.fillText('Log this exercise on 2 dates to see its trend',15,110);return}let vals=pts.map(x=>x.value),lo=Math.min(...vals)-3,hi=Math.max(...vals)+3;ctx.strokeStyle='#344054';for(let i=0;i<4;i++){let y=20+i*50;ctx.beginPath();ctx.moveTo(46,y);ctx.lineTo(525,y);ctx.stroke();ctx.fillText((hi-(hi-lo)*i/3).toFixed(0),4,y+4)}ctx.strokeStyle='#73e2b2';ctx.lineWidth=3;ctx.beginPath();pts.forEach((x,i)=>{let px=48+i*474/(pts.length-1),py=20+(hi-x.value)/(hi-lo)*150;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();ctx.fillStyle='#aab6ca';ctx.fillText(pts[0].date,48,210);ctx.fillText(pts.at(-1).date,415,210)}
function insights(){let q=weeklySummary(),names=exerciseTrend(),last=recent(data.weights,1)[0],prior=data.weights.slice().sort((a,b)=>b.date.localeCompare(a.date)).find(x=>daysAgo(x.date)>=7&&daysAgo(x.date)<=14),delta=last&&prior?(last.weight-prior.weight).toFixed(1):null,advice=[];
if(q.s.length===0)advice.push('Log your next workout to start a weekly performance review.');else if(q.s.length>=6)advice.push('You logged six or more sessions this week. Monitor recovery and keep at least one rest day.');else advice.push('You logged '+q.s.length+' of six planned sessions. Consistency matters more than adding extra volume.');
if(q.protein===null)advice.push('Log daily protein intake to evaluate your cut.');else if(q.protein<data.profile.protein*.9)advice.push('Your logged protein average is below your target. Aim to bring it closer to '+data.profile.protein+' g/day.');else advice.push('Your logged protein average is near your target.');
if(delta!==null)advice.push('Your latest weight is '+(Number(delta)>0?'+':'')+delta+' lb versus a weigh-in 7–14 days earlier. Use weekly averages for decisions.');
if(q.shoulder!==null&&q.shoulder>=3)advice.push('Your logged shoulder symptoms warrant caution with painful presses; recurring pain should be assessed by a sports PT.');
return `<h2>Training insights</h2><p>Automatic, offline analysis of your saved training and nutrition logs. These are trends, not diagnoses or an AI-generated assessment.</p><div class="grid">${stat('Sessions this week',q.s.length+' / 6')}${stat('Working-set volume',Math.round(q.volume).toLocaleString()+' lb')}${stat('Avg protein',q.protein===null?'—':Math.round(q.protein)+' g')}${stat('Avg calories',q.calories===null?'—':Math.round(q.calories))}</div>
<div class="card"><div class="row spread"><h3>Weekly coaching report</h3><button class="secondary" id="copyReport">Copy report</button></div><small>${esc(q.start)} – ${esc(q.now)}</small>${advice.map(x=>`<p>• ${esc(x)}</p>`).join('')}<div class="note">Strength estimates are based on recorded sets. During a cut, maintaining strength is meaningful progress.</div></div>
<div class="card"><h3>Strength trend by exercise</h3><div class="field"><label>Select exercise</label><select id="trendSelect">${names.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><canvas id="exerciseChart" width="550" height="220"></canvas><small>Estimated 1RM trend from the best logged set each session. Different rep ranges can affect estimates.</small></div>
<div class="card"><h3>Next session suggestions</h3>${[0,2,5].map(d=>`<p><strong>${esc(DAYS[d].ex[0][0])}:</strong> ${esc(recommend(d,0))}</p>`).join('')}</div>`}
function wireInsights(){let t=el('trendSelect');if(t){drawExerciseTrend(t.value);t.onchange=()=>drawExerciseTrend(t.value)}let b=el('copyReport');if(b)b.onclick=()=>{let q=weeklySummary(),txt=`ASCEND weekly report (${q.start}–${q.now})\nSessions: ${q.s.length}/6\nTotal working-set volume: ${Math.round(q.volume)} lb\nAverage protein: ${q.protein===null?'unlogged':Math.round(q.protein)+'g'}\nAverage calories: ${q.calories===null?'unlogged':Math.round(q.calories)}\n`+coachSummary();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>alert('Report copied. You can paste it into ChatGPT.'),()=>alert('Clipboard unavailable.'));else alert('Clipboard not supported in this browser.')}}

function render(){nav();el("view").innerHTML=({Dashboard:dashboard,Workouts:workouts,Insights:insights,PRs:prs,Coach:coach,Nutrition:nutrition,Progress:progress,Settings:settings})[tab]();wire()}
function wire(){
if(tab==="Dashboard")el("gotoWorkout").onclick=()=>{day=Math.min(5,(new Date().getDay()+6)%7);tab="Workouts";render()};
if(tab==="Workouts"){
document.querySelectorAll("[data-rest]").forEach(b=>b.onclick=()=>startRest(+b.dataset.rest));el("stopRest").onclick=stopRest;updateRestClock();
el("daySelect").onchange=e=>{day=+e.target.value;render()};el("workoutDate").onchange=e=>{workoutDate=e.target.value;render()};
const k=draftKey();document.querySelectorAll("[data-sub]").forEach(e=>e.onchange=()=>{data.substitutions[day+"-"+e.dataset.sub]=e.value;save();render()});
document.querySelectorAll("[data-set]").forEach(e=>e.oninput=()=>{const id=e.dataset.set;draft[k][id]??={};draft[k][id][e.dataset.prop]=e.type==="checkbox"?e.checked:e.value});
el("shoulder").oninput=e=>draft[k].shoulder=e.target.value;el("sessionNotes").oninput=e=>draft[k].notes=e.target.value;
el("clearDraft").onclick=()=>{if(confirm("Clear this unsaved workout?")){delete draft[k];render()}};
el("saveWorkout").onclick=()=>{const sets=[];DAYS[day].ex.forEach((x,i)=>{for(let j=0;j<x[1];j++){const s=draft[k][`${i}-${j}`];if(s?.done&&s.reps!==""&&s.reps!==undefined)sets.push({exercise:selectedExercise(day,i),slot:i,set:j+1,weight:num(s.weight),reps:num(s.reps),rir:s.rir===""?null:num(s.rir)})}});if(!sets.length)return alert("Check completed for at least one set and enter its reps.");data.sessions.push({id:Date.now().toString()+Math.random().toString(36).slice(2,6),date:workoutDate,day,sets,shoulder:num(draft[k].shoulder),notes:draft[k].notes||""});delete draft[k];save();alert("Workout saved.");render()};
}
if(tab==="Insights"){wireInsights()}
if(tab==="Coach"){el("askCoach").onclick=askCoach;el("coachQuestion").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();askCoach()}};document.querySelectorAll("[data-prompt]").forEach(b=>b.onclick=()=>{el("coachQuestion").value=b.dataset.prompt;askCoach()});el("copyCoach").onclick=()=>navigator.clipboard?.writeText(coachSummary()).then(()=>alert("Summary copied. Paste it into ChatGPT for personalized coaching."),()=>alert("Select and copy the summary manually."))}
if(tab==="Nutrition"){el("nutritionDate").onchange=e=>{nutritionDate=e.target.value;render()};el("saveNutrition").onclick=()=>{const o={date:nutritionDate};["calories","protein","carbs","fat","water","sleep"].forEach(k=>o[k]=num(el("n_"+k).value));o.creatine=el("n_creatine").checked;o.notes=el("n_notes").value;data.nutrition=data.nutrition.filter(x=>x.date!==nutritionDate);data.nutrition.push(o);save();render()}}
if(tab==="Progress"){el("saveWeight").onclick=()=>{let date=el("weightDate").value,w=num(el("weightValue").value);if(!date||w<=0)return alert("Enter a date and valid body weight.");data.weights=data.weights.filter(x=>x.date!==date);data.weights.push({date,weight:w});save();render()};document.querySelectorAll("[data-delete-weight]").forEach(b=>b.onclick=()=>{if(confirm("Delete this weigh-in?")){data.weights=data.weights.filter(x=>x.date!==b.dataset.deleteWeight);save();render()}});document.querySelectorAll("[data-delete-session]").forEach(b=>b.onclick=()=>{if(confirm("Delete this workout?")){data.sessions=data.sessions.filter(x=>x.id!==b.dataset.deleteSession);save();render()}});drawChart()}
if(tab==="Settings"){el("saveSettings").onclick=()=>{Object.keys(data.profile).filter(k=>k!=="start").forEach(k=>data.profile[k]=num(el("p_"+k).value));save();render()};el("export").onclick=()=>download("iron-atlas-backup.json",JSON.stringify(data,null,2),"application/json");el("exportCSV").onclick=()=>{let lines=["date,workout,exercise,set,weight_lb,reps,rir,shoulder_pain"];data.sessions.forEach(s=>s.sets.forEach(x=>lines.push([s.date,DAYS[s.day].title,x.exercise,x.set,x.weight,x.reps,x.rir??"",s.shoulder].map(csv).join(","))));download("iron-atlas-workouts.csv",lines.join("\n"),"text/csv")};el("import").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!x.profile||!Array.isArray(x.sessions)||!Array.isArray(x.nutrition)||!Array.isArray(x.weights))throw Error("Invalid backup structure");if(confirm("Replace all current data with this backup?")){data=x;save();render()}}catch(err){alert("Could not import: "+err.message)}}}
}
function csv(s){return '"'+String(s??"").replace(/"/g,'""')+'"'}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function drawChart(){const c=el("weightChart");if(!c)return;const ctx=c.getContext("2d"),pts=data.weights.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-30);ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle="#aab6ca";ctx.font="14px system-ui";if(pts.length<2){ctx.fillText("Log 2+ weigh-ins to see your trend",25,110);return}let vals=pts.map(x=>x.weight),lo=Math.min(...vals)-1,hi=Math.max(...vals)+1;ctx.strokeStyle="#344054";for(let i=0;i<4;i++){let y=20+i*55;ctx.beginPath();ctx.moveTo(48,y);ctx.lineTo(530,y);ctx.stroke();ctx.fillText((hi-(hi-lo)*i/3).toFixed(1),3,y+4)}ctx.strokeStyle="#73e2b2";ctx.lineWidth=3;ctx.beginPath();pts.forEach((x,i)=>{let px=50+i*475/(pts.length-1),py=20+(hi-x.weight)/(hi-lo)*165;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();ctx.fillStyle="#aab6ca";ctx.fillText(pts[0].date,48,210);ctx.fillText(pts.at(-1).date,425,210)}
render();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
