14px 0;border-top:1px solid var(--line)}.exercise:first-child{border:0}.exercise strong{font-size:15px}.pill{display:inline-block;background:#283448;color:#d2e1f4;padding:4px 8px;border-radius:6px;font-size:12px;margin:4px 4px 4px 0}.sets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.sets .field{margin:0}.note{background:#14243b;border-left:3px solid var(--blue);padding:12px;border-radius:5px;color:#dce8f7;margin:12px 0}.success{color:var(--accent)}.warn{color:#ffd58c}.hidden{display:none!important}table{border-collapse:collapse;width:100%}td,th{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted)}.scroll{overflow:auto}canvas{width:100%;height:200px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.footer{font-size:12px;color:var(--muted);padding:25px 0}input[type=checkbox]{width:auto;accent-color:var(--accent)}@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.sets{grid-template-columns:repeat(2,1fr)}header{padding:18px}.wrap{padding:12px}}@media(max-width:380px){.grid{grid-template-columns:1fr}}

<header><div><h1>ASCEND <span style="color:var(--accent)">/ PERFORMANCE</span></h1><small>PERFORMANCE / STRENGTH / PROGRESS</small></div><span class="tag">PERSONAL · V7.0</span></header>
<main class="wrap"><nav class="nav" id="nav"></nav><div id="view"></div><div class="footer">Data is stored in this browser on this device. Export backups regularly. This tool is a training log, not medical supervision.</div></main>
<script>
"use strict";
const BASE_DAYS=[
{title:"Push A · Bench Strength",ex:[["Barbell bench press",3,"4–6","3","175–190 lb"],["Neutral-grip DB incline press",2,"8–10","2–3",""],["Cable chest fly",2,"10–15","2",""],["Cable lateral raise",3,"12–20","2",""],["Rope triceps pushdown",3,"10–15","1–2",""],["Cable external rotation",2,"12–15","Easy",""]]},
{title:"Pull A · Back Strength",ex:[["Weighted pull-up or pulldown",3,"5–8","2",""],["Chest-supported row",3,"6–10","2",""],["Neutral-grip cable row",2,"10–12","2",""],["Reverse pec deck",3,"12–20","2",""],["EZ-bar curl",3,"8–12","1–2",""],["Hammer curl",2,"10–15","1–2",""]]},
{title:"Legs A · Squat Strength",ex:[["Barbell back squat",3,"4–6","2–3","285–305 lb"],["Leg press",3,"8–12","2",""],["Seated leg curl",3,"10–15","2",""],["Leg extension",2,"12–15","1–2",""],["Standing calf raise",4,"8–12","1–2",""],["Cable crunch",3,"10–15","2",""]]},
{title:"Push B · Hypertrophy",ex:[["Neutral-grip DB chest press",3,"8–12","2–3",""],["Converging chest press machine",2,"10–12","2",""],["Cable chest fly",2,"12–15","2",""],["Cable lateral raise",3,"12–20","2",""],["Single-arm cable triceps extension",3,"10–15","1–2",""],["Serratus wall slide",2,"10–12","Easy",""]]},
{title:"Pull B · Hypertrophy",ex:[["Neutral-grip lat pulldown",3,"8–12","2",""],["Machine high row",3,"8–12","2",""],["Single-arm cable row",2,"10–15","2",""],["Reverse pec deck",2,"15–20","2",""],["Incline DB curl",3,"10–12","1–2",""],["Preacher curl",2,"10–15","1–2",""]]},
{title:"Legs B · Deadlift Strength",ex:[["Conventional deadlift",2,"3–5","3","305–325 lb"],["Hack squat",3,"8–12","2",""],["Seated leg curl",3,"10–15","2",""],["Bulgarian split squat",2,"8–12/leg","2",""],["Seated calf raise",4,"10–15","1–2",""],["Hanging knee raise",3,"10–15","2",""]]}];
let DAYS=BASE_DAYS.map(d=>({title:d.title,ex:d.ex.map(x=>[...x])}));
const KEY="iron_atlas_v1", TODAY=()=>new Date().toLocaleDateString("en-CA");
const defaults=()=>({profile:{weight:235,bench:250,squat:405,deadlift:435,calories:2800,protein:205,creatine:5,start:TODAY()},sessions:[],nutrition:[],weights:[],notes:[],substitutions:{},coachMessages:[]});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||defaults()}catch(e){data=defaults()}
data.substitutions??={};data.coachMessages??=[];data.readiness??=[];
data.program??=BASE_DAYS.map(d=>({title:d.title,ex:d.ex.map(x=>[...x])}));
data.goals??={bench:275,squat:455,deadlift:495,bodyweight:220};
data.trainingBlock??={start:TODAY(),weeks:6,notes:""};
function normalizeProgram(){if(!Array.isArray(data.program)||!data.program.length)data.program=BASE_DAYS.map(d=>({title:d.title,ex:d.ex.map(x=>[...x])}));data.program=data.program.map((d,i)=>({title:String(d.title||`Workout ${i+1}`),ex:Array.isArray(d.ex)?d.ex.filter(x=>Array.isArray(x)&&x[0]).map(x=>[String(x[0]),Math.max(1,Math.min(12,num(x[1],3))),String(x[2]||"8–12"),String(x[3]??"2"),String(x[4]||"")]):[]}));DAYS=data.program;day=Math.min(day,DAYS.length-1)}

let tab="Dashboard",day=0,workoutDate=TODAY(),draft={},nutritionDate=TODAY();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert("Unable to save locally. Export a backup and check available storage.");return false}};
const num=(v,f=0)=>Number.isFinite(+v)&&String(v).trim()!==""?+v:f;
const recent=(a,n=5)=>a.slice().sort((x,y)=>y.date.localeCompare(x.date)).slice(0,n);
const el=id=>document.getElementById(id);
function nav(){el("nav").innerHTML=["Dashboard","Workouts","Program","Insights","PRs","Coach","Nutrition","Progress","Settings"].map(t=>`<button class="${tab===t?"active":""}" data-tab="${t}">${t}</button>`).join("");document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function stat(label,value,sub=""){return `<div class="card"><div class="label">${label}</div><div class="stat">${esc(value)}</div><small>${esc(sub)}</small></div>`}
function dashboard(){
const today=TODAY(), n=data.nutrition.find(x=>x.date===today)||{}, w=data.weights.find(x=>x.date===today), r=data.readiness.find(x=>x.date===today)||{}, suggested=(new Date().getDay()+6)%7, sessions=data.sessions.filter(x=>x.date>=new Date(Date.now()-6*864e5).toLocaleDateString("en-CA"));
const score=[n.creatine===true,Number.isFinite(+n.sleep)&&n.sleep>0,!!w,!!r.date,Number.isFinite(+n.protein)&&n.protein>0].filter(Boolean).length;
return `<div class="dash-hero"><div><div class="label">DAILY COMMAND CENTER · ${esc(today)}</div><h2>Everything you need, in one place.</h2><p>Log your essentials here. Use the other tabs for full history, charts, and deeper coaching.</p></div><div class="dash-count"><strong>${score}/5</strong><small>daily essentials</small></div></div>
<div class="card dash-start"><div class="row spread"><div><div class="label">TODAY'S TRAINING</div><h3>${suggested>=DAYS.length?"Recovery day":esc(DAYS[suggested].title)}</h3><small>${sessions.length} workout${sessions.length===1?"":"s"} logged in the last 7 days</small></div><button id="gotoWorkout" class="start-btn">▶ Start workout</button></div><div class="row"><label style="margin:0">Start a different workout</label><select id="dashWorkoutSelect" style="max-width:320px">${DAYS.map((d,i)=>`<option value="${i}" ${i===Math.min(suggested,DAYS.length-1)?"selected":""}>${esc(d.title)}</option>`).join("")}</select></div></div>
<div class="dash-metrics">${stat("Today's weight",w?`${w.weight} lb`:"Not logged","Body weight")}${stat("Creatine",n.creatine?"✓ Taken":"Not logged",`${data.profile.creatine} g target`)}${stat("Sleep",n.sleep>0?`${n.sleep} hrs`:"Not logged","Hours slept")}${stat("Protein",n.protein>0?`${n.protein} / ${data.profile.protein} g`:"Not logged","Daily intake")}</div>
<div class="two">
<div class="card"><div class="row spread"><h3>Daily essentials</h3><span class="pill">QUICK LOG</span></div><div class="field"><label>Morning weight (lb)</label><input id="dashWeight" type="number" min="1" max="1000" step=".1" inputmode="decimal" placeholder="e.g. 235.0" value="${esc(w?.weight??"")}"></div><div class="field"><label>Hours slept</label><input id="dashSleep" type="number" min="0" max="24" step=".25" inputmode="decimal" placeholder="e.g. 7.5" value="${esc(n.sleep??"")}"></div><div class="field"><label class="check-line"><input id="dashCreatine" type="checkbox" ${n.creatine?"checked":""}> Took creatine today (${esc(data.profile.creatine)} g)</label></div><div class="two"><div class="field"><label>Calories eaten</label><input id="dashCalories" type="number" min="0" step="1" inputmode="numeric" placeholder="Optional" value="${esc(n.calories??"")}"></div><div class="field"><label>Protein (g)</label><input id="dashProtein" type="number" min="0" step="1" inputmode="numeric" placeholder="Optional" value="${esc(n.protein??"")}"></div></div><button id="dashSaveEssentials">Save today's essentials</button><small id="dashSaveStatus" aria-live="polite"></small><p class="muted">Saving updates the same records used by Nutrition and Progress. Blank optional fields do not erase previously logged values.</p></div>
<div class="card"><div class="row spread"><h3>How are you feeling?</h3><span class="pill">READINESS</span></div><p>Quick 1–5 check-in before your workout.</p><div class="two">${[["Sleep","sleep","Sleep quality"],["Energy","energy","Energy"],["Soreness","soreness","Muscle soreness (5 = high)"],["Motivation","motivation","Motivation"]].map(([label,key,description])=>`<div class="field"><label>${description}</label><select id="ready${label}">${[1,2,3,4,5].map(v=>`<option value="${v}" ${v===(r[key]||3)?"selected":""}>${v} / 5</option>`).join("")}</select></div>`).join("")}</div><button id="saveReadiness" class="secondary">Save readiness</button><small id="readinessMessage" aria-live="polite">${r.date?"Today's check-in saved":"No check-in today"}</small></div></div>
<div class="card"><div class="row spread"><h3>Explore your progress</h3><span class="pill">DEEP DIVES</span></div><div class="dash-links"><button class="secondary" data-goto="Nutrition">Nutrition details</button><button class="secondary" data-goto="Progress">Weight & workout history</button><button class="secondary" data-goto="Insights">Strength insights</button><button class="secondary" data-goto="Program">Edit training plan</button><button class="secondary" data-goto="Coach">Coaching</button><button class="secondary" data-goto="PRs">Personal records</button></div></div>
<div class="card"><h3>Recent workouts</h3>${data.sessions.length?`<div class="scroll"><table><tr><th>Date</th><th>Session</th><th>Sets</th></tr>${recent(data.sessions,4).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(DAYS[x.day]?.title||"Archived workout")}</td><td>${x.sets.length}</td></tr>`).join("")}</table></div>`:"<p>No workouts saved yet. Tap Start workout to begin.</p>"}</div>`;
}
function draftKey(){return workoutDate+"|"+day}
function workouts(){
const d=DAYS[day],prev=recent(data.sessions.filter(s=>s.day===day),1)[0],k=draftKey();draft[k]??={};
return `<div class="row spread"><h2>Workout logger</h2><select id="daySelect" style="max-width:300px">${DAYS.map((x,i)=>`<option value="${i}" ${i===day?"selected":""}>${esc(x.title)}</option>`).join("")}</select></div>
<div class="card"><div class="row spread" style="margin-bottom:12px"><div><div class="label">REST TIMER</div><div id="restClock" class="stat" style="font-variant-numeric:tabular-nums">00:00</div></div><div class="buttons"><button type="button" class="secondary" data-rest="90">1:30</button><button type="button" class="secondary" data-rest="120">2:00</button><button type="button" class="secondary" data-rest="180">3:00</button><button type="button" class="danger" id="stopRest">Stop</button></div></div><div class="two"><div class="field"><label>Workout date</label><input id="workoutDate" type="date" value="${workoutDate}"></div><div class="field"><label>Shoulder pain (0–10)</label><input id="shoulder" type="number" min="0" max="10" value="${esc(draft[k].shoulder??0)}"></div></div><div class="note">Working sets only. Rest 2–4 min on compounds, 60–120 sec on accessories. Avoid forcing painful reps. Recurrent pressing pain deserves a sports PT assessment.</div>
${d.ex.map((x,i)=>`<div class="exercise"><div class="row spread"><strong>${i+1}. ${esc(x[0])}</strong><span class="pill">${x[1]} × ${esc(x[2])} · ${esc(x[3])} RIR</span></div>${x[4]?`<small>Initial reference: ${esc(x[4])}, adjust to actual RIR</small>`:""}
<div class="row" style="margin:8px 0"><label style="margin:0">Exercise option</label><select data-sub="${i}" style="max-width:330px">${exerciseOptions(x[0]).map(v=>`<option ${selectedExercise(day,i)===v?"selected":""}>${esc(v)}</option>`).join("")}</select></div>
<div class="note" style="margin:8px 0">${esc(performanceAdvice(day,i))}</div>${prev?`<div><small>Previous: ${prev.sets.filter(s=>s.slot===i||s.exercise===x[0]).map(s=>`${s.weight}×${s.reps}`).join(" · ")||"not logged"}</small></div>`:""}
${Array.from({length:x[1]},(_,j)=>{const v=draft[k][`${i}-${j}`]||{};return `<div class="sets"><div class="field"><label>Set ${j+1} · lb</label><input type="number" min="0" step="0.5" data-set="${i}-${j}" data-prop="weight" value="${esc(v.weight??"")}" placeholder="Weight"></div><div class="field"><label>Reps</label><input type="number" min="0" data-set="${i}-${j}" data-prop="reps" value="${esc(v.reps??"")}" placeholder="Reps"></div><div class="field"><label>RIR</label><input type="number" min="0" max="10" data-set="${i}-${j}" data-prop="rir" value="${esc(v.rir??"")}" placeholder="RIR"></div><div class="field"><label>Completed</label><input type="checkbox" data-set="${i}-${j}" data-prop="done" ${v.done?"checked":""}></div></div>`}).join("")}</div>`).join("")}
<div class="field"><label>Session notes / pain after training</label><textarea id="sessionNotes" placeholder="Energy, form, shoulder response, etc.">${esc(draft[k].notes??"")}</textarea></div><div class="buttons"><button id="saveWorkout">Save completed workout</button><button class="secondary" id="clearDraft">Clear draft</button></div></div>`;
}
function nutrition(){
let n=data.nutrition.find(x=>x.date===nutritionDate)||{};
return `<h2>Nutrition & recovery</h2><div class="grid">${stat("Calories target",data.profile.calories,"Provisional")}${stat("Protein target",data.profile.protein+" g","Daily")}${stat("Creatine",data.profile.creatine+" g","Daily")}${stat("Weight-loss pace","0.5–1 lb","Per week")}</div>
<div class="card"><div class="field"><label>Log date</label><input type="date" id="nutritionDate" value="${nutritionDate}"></div><div class="two">
${[["calories","Calories eaten"],["protein","Protein (g)"],["carbs","Carbs (g)"],["fat","Fat (g)"],["water","Water (oz)"],["sleep","Sleep (hours)"]].map(([key,label])=>`<div class="field"><label>${label}</label><input id="n_${key}" type="number" min="0" step="any" value="${esc(n[key]??"")}"></div>`).join("")}</div>
<div class="field"><label><input id="n_creatine" type="checkbox" ${n.creatine?"checked":""}> Took 5 g creatine today</label></div>
<div class="field"><label>Meals / recovery notes</label><textarea id="n_notes">${esc(n.notes??"")}</textarea></div><button id="saveNutrition">Save daily nutrition</button></div>
<div class="card"><h3>Recent nutrition logs</h3><div class="scroll"><table><tr><th>Date</th><th>Calories</th><th>Protein</th><th>Creatine</th></tr>${recent(data.nutrition,10).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.calories||"—")}</td><td>${esc(x.protein||"—")} g</td><td>${x.creatine?"✓":"—"}</td></tr>`).join("")}</table></div></div>`;
}

function slotSets(s,d,i){return s.sets.filter(x=>x.slot===i||(!("slot" in x)&&x.exercise===DAYS[d].ex[i][0]))}
function recommend(d,i){
 const x=DAYS[d].ex[i],history=data.sessions.filter(s=>s.day===d&&slotSets(s,d,i).length).sort((a,b)=>b.date.localeCompare(a.date));
 if(!history.length)return "First session: choose a load that matches "+x[3]+" RIR. Record every working set.";
 const last=history[0],ss=slotSets(last,d,i),repRange=x[2].match(/^(\d+)[–-](\d+)/);
 if(!repRange)return "Repeat a comfortable load and focus on controlled movement.";
 const hi=+repRange[2],lo=+repRange[1],weight=ss[0]?.weight||0,rirTarget=parseFloat(x[3]),same=ss.every(t=>t.weight===weight),allTop=ss.length>=x[1]&&ss.every(t=>t.reps>=hi&&t.rir!==null&&t.rir>=rirTarget);
 if(last.shoulder>=4&&(d===0||d===3))return "Shoulder symptoms were elevated last session. Do not increase pressing load; consider a comfortable substitute and professional assessment.";
 if(allTop&&same&&weight>0){let inc=(d===2||d===5)?5:2.5;return "Progression ready: try "+(weight+inc)+" lb (+ "+inc+" lb), keeping "+x[3]+" RIR. For dumbbells, use the smallest available jump."}

}
function performanceAdvice(d,i){
 const x=DAYS[d]?.ex[i];if(!x)return "No exercise selected";
 const name=selectedExercise(d,i),history=data.sessions.filter(s=>s.day===d&&s.sets.some(t=>t.exercise===name)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);
 if(history.length<2)return recommend(d,i)+" Log at least two comparable sessions for trend analysis.";
 const points=history.map(s=>Math.max(...s.sets.filter(t=>t.exercise===name&&num(t.weight)>0&&num(t.reps)>0).map(t=>num(t.weight)*(1+num(t.reps)/30))));
 const last=points[0],prior=points.slice(1).reduce((a,b)=>a+b,0)/(points.length-1),change=prior?(last/prior-1)*100:0;
 const r=recent(data.readiness,1)[0];if(r&&(num(r.sleep,3)<=2||num(r.energy,3)<=2||num(r.soreness,3)>=4))return "Recovery check-in suggests caution. Hold load, assess warm-ups, and avoid forcing reps. "+recommend(d,i);
 if(change< -4)return "Estimated performance is down "+Math.abs(change).toFixed(1)+"% vs recent sessions. Consider holding or slightly reducing load and reviewing recovery. "+recommend(d,i);

}

function dateToLocal(d){let t=new Date(d+'T12:00:00');return Number.isNaN(t.getTime())?null:t}
function daysAgo(d){const x=dateToLocal(d);return x?Math.floor((Date.now()-x.getTime())/86400000):9999}
function sevenDayAverage(entries,field,anchorDate){const end=dateToLocal(anchorDate);if(!end)return null;const start=end.getTime()-6*86400000;const vals=entries.filter(x=>{let t=dateToLocal(x.date)?.getTime();return t>=start&&t<=end.getTime()}).map(x=>Number(x[field])).filter(Number.isFinite);return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null}

return `<div class="row spread"><h2>Program builder</h2><button class="secondary" id="addDay">+ Add workout day</button></div><p>Edit your split without touching code. Changes affect future sessions; historical sets remain saved. Export a backup before restructuring your program.</p>

<div class="scroll"><table><tr><th>Exercise</th><th>Sets</th><th>Rep range</th><th>RIR</th><th></th></tr>${d.ex.map((x,j)=>`<tr><td><input aria-label="Exercise name" data-ex-field="${i}:${j}:0" value="${esc(x[0])}"></td><td><input type="number" min="1" max="12" data-ex-field="${i}:${j}:1" value="${esc(x[1])}" style="min-width:60px"></td><td><input aria-label="Rep range" data-ex-field="${i}:${j}:2" value="${esc(x[2])}" style="min-width:95px"></td><td><input aria-label="RIR" data-ex-field="${i}:${j}:3" value="${esc(x[3])}" style="min-width:65px"></td><td><button class="danger" data-remove-ex="${i}:${j}">×</button></td></tr>`).join("")}</table></div><div class="buttons"><button class="secondary" data-add-ex="${i}">+ Exercise</button></div></div>`).join("")}
<div class="card"><h3>Program controls</h3><div class="buttons"><button id="saveProgram">Save program changes</button><button class="secondary" id="resetProgram">Restore original PPL template</button></div><p class="muted">Removing or rearranging days may change the displayed name of old sessions because older logs use a day index. Exercise and set data are preserved.</p></div>`}
function wireProgram(){
 const collect=()=>{document.querySelectorAll('[data-day-name]').forEach(e=>data.program[+e.dataset.dayName].title=e.value.trim()||'Workout');document.querySelectorAll('[data-ex-field]').forEach(e=>{let [d,i,k]=e.dataset.exField.split(':').map(Number);data.program[d].ex[i][k]=k===1?Math.max(1,Math.min(12,num(e.value,3))):e.value.trim()});};
 el('saveProgram').onclick=()=>{collect();normalizeProgram();save();alert('Program saved');render()};
 el('addDay').onclick=()=>{collect();data.program.push({title:'New workout',ex:[['New exercise',3,'8–12','2','']]});save();render()};
 document.querySelectorAll('[data-remove-day]').forEach(b=>b.onclick=()=>{if(data.program.length===1)return alert('Keep at least one day');if(confirm('Remove this day? Older sessions retain their set records but day labels may change.')){collect();data.program.splice(+b.dataset.removeDay,1);day=0;save();render()}});
 document.querySelectorAll('[data-add-ex]').forEach(b=>b.onclick=()=>{collect();data.program[+b.dataset.addEx].ex.push(['New exercise',3,'8–12','2','']);save();render()});
 document.querySelectorAll('[data-remove-ex]').forEach(b=>b.onclick=()=>{collect();const [d,i]=b.dataset.removeEx.split(':').map(Number);data.program[d].ex.splice(i,1);save();render()});
 el('resetProgram').onclick=()=>{if(confirm('Restore the original six-day PPL program? Historical workouts remain, but day labels may change.')){data.program=BASE_DAYS.map(d=>({title:d.title,ex:d.ex.map(x=>[...x])}));data.substitutions={};day=0;save();render()}};
}
function avgWeightWindow(end,offset){let endDate=new Date(end+'T12:00:00');endDate.setDate(endDate.getDate()-offset);let upper=endDate.getTime(),lower=upper-6*86400000,values=data.weights.filter(x=>{let t=dateToLocal(x.date)?.getTime();return t>=lower&&t<=upper}).map(x=>num(x.weight)).filter(x=>x>0);return values.length?values.reduce((a,b)=>a+b,0)/values.length:null}
function goalProgress(current,target,baseline){if(!target||!baseline||target===baseline)return 'Set a distinct goal';let pct=Math.max(0,Math.min(100,(current-baseline)/(target-baseline)*100));return pct.toFixed(0)+'% toward target'}
function coachingExtras(){let goals=data.goals||{},p=data.profile,prs=getPRs(),bench=prs.find(x=>x.exercise==='Barbell bench press'),current=Math.max(num(p.bench),bench?.bestEstimated||0),currentW=avgWeightWindow(TODAY(),0),previousW=avgWeightWindow(TODAY(),7),change=currentW!==null&&previousW!==null?currentW-previousW:null,block=data.trainingBlock||{},start=dateToLocal(block.start),weeks=start?Math.max(1,Math.floor((Date.now()-start.getTime())/(7*86400000))+1):1;
const recentSessions=data.sessions.filter(s=>daysAgo(s.date)<=21),fatigue=recent(data.readiness,3).filter(r=>r.sleep<=2||r.energy<=2||r.soreness>=4).length;
return `<div class="card"><h3>Strength goals</h3><div class="grid">${stat('Bench target',num(goals.bench,275)+' lb',goalProgress(current,num(goals.bench,275),num(p.bench)))}${stat('Squat target',num(goals.squat,455)+' lb')}${stat('Deadlift target',num(goals.deadlift,495)+' lb')}${stat('Bodyweight target',num(goals.bodyweight,220)+' lb')}</div><p>Bench baseline ${num(p.bench)} lb; best logged estimated bench ${bench?bench.bestEstimated.toFixed(1)+' lb':'not yet logged'}. Estimates are not tested maxes.</p></div>
<div class="card"><h3>Cutting trend</h3><p>Current 7-day weight average: <strong>${currentW===null?'Not enough entries':currentW.toFixed(1)+' lb'}</strong>. Previous 7-day average: <strong>${previousW===null?'Not enough entries':previousW.toFixed(1)+' lb'}</strong>.</p><p>${change===null?'Log weigh-ins across two weeks to compare averages.':'Change in weekly averages: '+(change>0?'+':'')+change.toFixed(1)+' lb. Short-term water shifts can obscure fat loss.'}</p></div>
<div class="card"><h3>Training block & deload guidance</h3><p>Block week <strong>${weeks}</strong> of ${num(block.weeks,6)} (start ${esc(block.start||TODAY())}). ${fatigue>=2?'Multiple recent low-readiness check-ins: consider reducing volume or load for a week.':weeks>num(block.weeks,6)?'Planned block duration reached. Review performance and fatigue before starting the next block.':'Monitor performance and fatigue; a deload is not automatically required.'}</p><p>${recentSessions.length} sessions logged in the past 21 days. Guidance is rule-based, not a diagnosis.</p></div>
<div class="card"><h3>Plate calculator</h3><div class="two"><div class="field"><label>Total target weight (lb)</label><input id="plateTarget" type="number" min="45" step="2.5" value="225"></div><div class="field"><label>Bar weight (lb)</label><input id="barWeight" type="number" min="0" value="45"></div></div><div class="field"><label>Available plates per side (comma separated, lb)</label><input id="platesAvailable" value="45,35,25,10,5,2.5"></div><button id="calcPlates" class="secondary">Calculate plates</button><p id="plateResult"></p></div>`}
function calcPlates(){let target=num(el('plateTarget').value),bar=num(el('barWeight').value),remaining=(target-bar)/2,plates=el('platesAvailable').value.split(',').map(x=>num(x,-1)).filter(x=>x>0).sort((a,b)=>b-a),used=[];if(target<bar||!plates.length)return el('plateResult').textContent='Enter valid bar and plate weights.';for(let p of plates){let count=Math.floor((remaining+1e-8)/p);if(count>0){used.push(count+' × '+p+' lb');remaining-=count*p}}el('plateResult').textContent=remaining>0.01?'Closest per side: '+used.join(' + ')+'; missing '+remaining.toFixed(2)+' lb per side.':'Per side: '+(used.join(' + ')||'No plates')+'.'}
function sessionEditor(){let s=data.sessions.find(x=>x.id===editingSession);if(!s)return '<h3>Workout not found</h3>';return `<div class="card"><h3>Edit workout · ${esc(s.date)}</h3><div class="two"><div class="field"><label>Date</label><input type="date" id="editDate" value="${esc(s.date)}"></div><div class="field"><label>Session notes</label><input id="editNotes" value="${esc(s.notes||'')}"></div></div><div class="scroll"><table><tr><th>Exercise</th><th>Weight</th><th>Reps</th><th>RIR</th><th></th></tr>${s.sets.map((x,i)=>`<tr><td><input data-edit="${i}:exercise" value="${esc(x.exercise)}"></td><td><input type="number" min="0" data-edit="${i}:weight" value="${esc(x.weight)}" style="min-width:70px"></td><td><input type="number" min="0" data-edit="${i}:reps" value="${esc(x.reps)}" style="min-width:60px"></td><td><input type="number" min="0" data-edit="${i}:rir" value="${esc(x.rir??'')}" style="min-width:60px"></td><td><button class="danger" data-edit-remove="${i}">×</button></td></tr>`).join('')}</table></div><div class="buttons"><button id="saveEdit">Save corrections</button><button class="secondary" id="cancelEdit">Cancel</button></div></div>`}
let editingSession=null;
function wireEditor(){if(!editingSession)return;let s=data.sessions.find(x=>x.id===editingSession);if(!s)return;el('cancelEdit').onclick=()=>{editingSession=null;render()};el('saveEdit').onclick=()=>{s.date=el('editDate').value;s.notes=el('editNotes').value;document.querySelectorAll('[data-edit]').forEach(e=>{let [i,k]=e.dataset.edit.split(':');s.sets[+i][k]=k==='exercise'?e.value.trim():e.value===''&&k==='rir'?null:num(e.value)});save();editingSession=null;render()};document.querySelectorAll('[data-edit-remove]').forEach(b=>b.onclick=()=>{if(confirm('Remove this set?')){s.sets.splice(+b.dataset.editRemove,1);save();render()}})}

function render(){normalizeProgram();nav();el("view").innerHTML=({Dashboard:dashboard,Workouts:workouts,Program:program,Insights:insights,PRs:prs,Coach:coach,Nutrition:nutrition,Progress:progress,Settings:settings})[tab]();wire()}
function wire(){
if(tab==="Dashboard"){
el("gotoWorkout").onclick=()=>{day=Math.max(0,Math.min(DAYS.length-1,num(el("dashWorkoutSelect").value)));workoutDate=TODAY();tab="Workouts";render();window.scrollTo({top:0,behavior:"smooth"})};
document.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{tab=b.dataset.goto;render();window.scrollTo({top:0,behavior:"smooth"})});
el("dashSaveEssentials").onclick=()=>{

let existing=data.nutrition.find(x=>x.date===date)||{date};
const entry={...existing,creatine:el("dashCreatine").checked};
if(sleepText)entry.sleep=num(sleepText);
if(caloriesText)entry.calories=num(caloriesText);

if(save()){render();el("dashSaveStatus").textContent="Saved for today ✓"}
};
el("saveReadiness").onclick=()=>{const r={date:TODAY(),sleep:num(el("readySleep").value),energy:num(el("readyEnergy").value),soreness:num(el("readySoreness").value),motivation:num(el("readyMotivation").value)};data.readiness=data.readiness.filter(x=>x.date!==r.date);data.readiness.push(r);save();el("readinessMessage").textContent="Saved for today"};
}
if(tab==="Workouts"){
document.querySelectorAll("[data-rest]").forEach(b=>b.onclick=()=>startRest(+b.dataset.rest));el("stopRest").onclick=stopRest;updateRestClock();
el("daySelect").onchange=e=>{day=+e.target.value;render()};el("workoutDate").onchange=e=>{workoutDate=e.target.value;render()};
const k=draftKey();document.querySelectorAll("[data-sub]").forEach(e=>e.onchange=()=>{data.substitutions[day+"-"+e.dataset.sub]=e.value;save();render()});
document.querySelectorAll("[data-set]").forEach(e=>e.oninput=()=>{const id=e.dataset.set;draft[k][id]??={};draft[k][id][e.dataset.prop]=e.type==="checkbox"?e.checked:e.value});
el("shoulder").oninput=e=>draft[k].shoulder=e.target.value;el("sessionNotes").oninput=e=>draft[k].notes=e.target.value;
el("clearDraft").onclick=()=>{if(confirm("Clear this unsaved workout?")){delete draft[k];render()}};
el("saveWorkout").onclick=()=>{const sets=[];DAYS[day].ex.forEach((x,i)=>{for(let j=0;j<x[1];j++){const s=draft[k][`${i}-${j}`];if(s?.done&&s.reps!==""&&s.reps!==undefined)sets.push({exercise:selectedExercise(day,i),slot:i,set:j+1,weight:num(s.weight),reps:num(s.reps),rir:s.rir===""?null:num(s.rir)})}});if(!sets.length)return alert("Check completed for at least one set and enter its reps.");data.sessions.push({id:Date.now().toString()+Math.random().toString(36).slice(2,6),date:workoutDate,day,sets,shoulder:num(draft[k].shoulder),notes:draft[k].notes||""});delete draft[k];save();alert("Workout saved.");render()};
}
if(tab==="Program"){wireProgram()}
if(tab==="Insights"){wireInsights();if(el("calcPlates"))el("calcPlates").onclick=calcPlates}
if(tab==="Coach"){el("askCoach").onclick=askCoach;el("coachQuestion").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();askCoach()}};document.querySelectorAll("[data-prompt]").forEach(b=>b.onclick=()=>{el("coachQuestion").value=b.dataset.prompt;askCoach()});el("copyCoach").onclick=()=>navigator.clipboard?.writeText(coachSummary()).then(()=>alert("Summary copied. Paste it into ChatGPT for personalized coaching."),()=>alert("Select and copy the summary manually."))}
if(tab==="Nutrition"){el("nutritionDate").onchange=e=>{nutritionDate=e.target.value;render()};el("saveNutrition").onclick=()=>{const o={date:nutritionDate};["calories","protein","carbs","fat","water","sleep"].forEach(k=>o[k]=num(el("n_"+k).value));o.creatine=el("n_creatine").checked;o.notes=el("n_notes").value;data.nutrition=data.nutrition.filter(x=>x.date!==nutritionDate);data.nutrition.push(o);save();render()}}
if(tab==="Progress"){document.querySelectorAll("[data-edit-session]").forEach(b=>b.onclick=()=>{editingSession=b.dataset.editSession;render()});wireEditor();el("saveWeight").onclick=()=>{let date=el("weightDate").value,w=num(el("weightValue").value);if(!date||w<=0)return alert("Enter a date and valid body weight.");data.weights=data.weights.filter(x=>x.date!==date);data.weights.push({date,weight:w});save();render()};document.querySelectorAll("[data-delete-weight]").forEach(b=>b.onclick=()=>{if(confirm("Delete this weigh-in?")){data.weights=data.weights.filter(x=>x.date!==b.dataset.deleteWeight);save();render()}});document.querySelectorAll("[data-delete-session]").forEach(b=>b.onclick=()=>{if(confirm("Delete this workout?")){data.sessions=data.sessions.filter(x=>x.id!==b.dataset.deleteSession);save();render()}});drawChart()}
if(tab==="Settings"){el("saveGoals").onclick=()=>{["bench","squat","deadlift","bodyweight"].forEach(k=>data.goals[k]=num(el("g_"+k).value));data.trainingBlock.start=el("blockStart").value;data.trainingBlock.weeks=Math.max(1,Math.min(52,num(el("blockWeeks").value,6)));save();render()};el("saveSettings").onclick=()=>{Object.keys(data.profile).filter(k=>k!=="start").forEach(k=>data.profile[k]=num(el("p_"+k).value));save();render()};el("export").onclick=()=>download("ascend-v7-backup.json",JSON.stringify(data,null,2),"application/json");el("exportCSV").onclick=()=>{let lines=["date,workout,exercise,set,weight_lb,reps,rir,shoulder_pain"];data.sessions.forEach(s=>s.sets.forEach(x=>lines.push([s.date,(DAYS[s.day]?.title||"Archived workout"),x.exercise,x.set,x.weight,x.reps,x.rir??"",s.shoulder].map(csv).join(","))));download("ascend-v7-workouts.csv",lines.join("\n"),"text/csv")};el("import").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!x.profile||!Array.isArray(x.sessions)||!Array.isArray(x.nutrition)||!Array.isArray(x.weights))throw Error("Invalid backup structure");if(confirm("Replace all current data with this backup?")){data=x;data.substitutions??={};data.coachMessages??=[];data.readiness??=[];data.program??=BASE_DAYS.map(d=>({title:d.title,ex:d.ex.map(x=>[...x])}));data.goals??={bench:275,squat:455,deadlift:495,bodyweight:220};data.trainingBlock??={start:TODAY(),weeks:6,notes:""};save();render()}}catch(err){alert("Could not import: "+err.message)}}}

function csv(s){return '"'+String(s??"").replace(/"/g,'""')+'"'}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function drawChart(){const c=el("weightChart");if(!c)return;const ctx=c.getContext("2d"),pts=data.weights.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-30);ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle="#9caec8";ctx.font="14px system-ui";if(pts.length<2){ctx.fillText("Log 2+ weigh-ins to see your trend",25,110);return}let vals=pts.map(x=>x.weight),lo=Math.min(...vals)-1,hi=Math.max(...vals)+1;ctx.strokeStyle="#26354b";for(let i=0;i<4;i++){let y=20+i*55;ctx.beginPath();ctx.moveTo(48,y);ctx.lineTo(530,y);ctx.stroke();ctx.fillText((hi-(hi-lo)*i/3).toFixed(1),3,y+4)}ctx.strokeStyle="#499bff";ctx.lineWidth=3;ctx.beginPath();pts.forEach((x,i)=>{let px=50+i*475/(pts.length-1),py=20+(hi-x.weight)/(hi-lo)*165;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();ctx.fillStyle="#9caec8";ctx.fillText(pts[0].date,48,210);ctx.fillText(pts.at(-1).date,425,210)}
